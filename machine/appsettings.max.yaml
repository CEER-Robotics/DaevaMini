# "Small" usa solo le pompe; "Large" accende i fusti e spegne le pompe con lo stesso liquido.
EventMode: "Small"

FlowRate:
  MillisecondsPerMilliliter: 117

FillDurationMs: 5000
CleanDurationMs: 15000
SettingsPin: "1234"

LiquidAssignments:
  - "Tonica"
  - "Prosecco"
  - "Limone"
  - "Bitter rosso"
  - "Vermouth"
  - "Vodka"
  - "Energy"
  - ""
  - "Bitter arancione"
  - "Gin"
  # Lines 11-14: pressurised kegs
  - "Tonica"
  - "Prosecco"
  - "Birra"
  - "Cola"

BottleCapacitiesMl:
  - 1000   # Line 1 Tonic (bottiglia, eventi piccoli)
  - 750    # Line 2 Prosecco
  - 1000   # Line 3 Limone
  - 700    # Line 4 Bitter rosso
  - 1000   # Line 5 Vermouth
  - 700    # Line 6 Vodka
  - 1000   # Line 7 Energy
  - 0      # Line 8 libera
  - 700    # Line 9 Bitter arancione
  - 700    # Line 10 Gin
  - 20000  # Line 11 Tonic (keg)
  - 20000  # Line 12 Prosecco (keg)
  - 30000  # Line 13 Birra (keg)
  - 20000  # Line 14 Cola (keg)

# Portata misurata per linea, in millilitri al secondo. 0 = usa FlowRate globale.
# Misura: eroga per 10 secondi, pesa il liquido raccolto, dividi per 10.
FlowRatesMlPerSecond:
  - 0      # Line 1 Tonic
  - 0      # Line 2 Prosecco
  - 0      # Line 3 Limone
  - 0      # Line 4 Bitter rosso
  - 0      # Line 5 Vermouth
  - 0      # Line 6 Vodka
  - 0      # Line 7 Energy
  - 0      # Line 8 free
  - 0      # Line 9 Bitter arancione
  - 0      # Line 10 Gin
  - 55     # Line 11 Tonic (keg)
  - 55     # Line 12 Prosecco (keg)
  - 55     # Line 13 Birra (keg) - 330 ml in 6 s
  - 55     # Line 14 Cola (keg)



